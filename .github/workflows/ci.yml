
name: CI - Docker, GHCR y Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Definir nombres de imagen
        id: image
        shell: bash
        run: |
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "dockerhub=${{ secrets.DOCKERHUB_USERNAME }}/dds-devops-nadiamata" >> "$GITHUB_OUTPUT"

      - name: Construir imagen Docker
        run: docker build -t dds-devops-demo:test .

      - name: Verificar funcionamiento
        run: |
          docker run -d --name web-test \
            -p 127.0.0.1:8080:80 \
            dds-devops-demo:test
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q "Hola DevOps"; then
              echo "Prueba exitosa"
              exit 0
            fi
            sleep 1
          done
          docker logs web-test
          exit 1

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar imagen para ambos registros
        run: |
          SHA_TAG="${GITHUB_SHA::7}"

          docker tag dds-devops-demo:test \
            ${{ steps.image.outputs.ghcr }}:latest
          docker tag dds-devops-demo:test \
            ${{ steps.image.outputs.ghcr }}:$SHA_TAG

          docker tag dds-devops-demo:test \
            ${{ steps.image.outputs.dockerhub }}:latest
          docker tag dds-devops-demo:test \
            ${{ steps.image.outputs.dockerhub }}:$SHA_TAG

      - name: Publicar imagen en GHCR
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          docker push ${{ steps.image.outputs.ghcr }}:latest
          docker push ${{ steps.image.outputs.ghcr }}:$SHA_TAG

      - name: Publicar imagen en Docker Hub
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          docker push ${{ steps.image.outputs.dockerhub }}:latest
          docker push ${{ steps.image.outputs.dockerhub }}:$SHA_TAG
      
      - name: Desplegar en Render
        run: curl -fsS "${{ secrets.RENDER_TRIGGER_URL }}"

